name: Source checks (no deployment)

on:
  pull_request:
  push:
    branches: [main]
  # Explicit human-invoked release admission; no publish or receipt writing.
  workflow_dispatch:

permissions:
  contents: read

# Budget: PRs execute changed-source suites plus check/build; main executes the
# cumulative test/check/build/Python ticket path. An explicit release dispatch
# also runs the existing fail-closed read-only release validator. No browser farm,
# paid service, cloud deploy, receipt generation or release promotion occurs here.
# Physical, independent security and release-readiness gates stay NOT_RUN until
# externally evidenced; source CI green does NOT mean release ready.
# controlcenter#413: native concurrency cancels a superseded run for the same PR
# or main ref instead of queueing it behind the newer commit. A manual release
# admission is never cancelled by a later dispatch, so both still execute.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  changed-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required: compare actual base/head, fail if base is absent
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # PDF.js uses Promise.try and Uint8Array.toHex; match the tested Node 26 runtime.
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - run: npm ci
      - name: Preflight pinned independent PDF/A validator
        run: node scripts/preflight-pdfa-validator-419.mjs
      - name: Install pinned independent consumer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          # Keep installer-generated files outside the source checkout: the
          # fail-closed change-impact gate rejects unknown working-tree paths.
          python3 -m venv "$RUNNER_TEMP/strumentini-ci-python"
          echo "$RUNNER_TEMP/strumentini-ci-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -m pip install --no-cache-dir 'Pillow==12.2.0' 'pypdf==6.16.1' 'python-pptx==1.0.2'
          sha256sum -c quality/donors/fatturapa/SHA256SUMS
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -m pip install --no-index --no-deps quality/donors/fatturapa/fatturapa-0.2.0-py3-none-any.whl
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -c 'import sys,importlib.metadata;assert sys.version_info[:3] == (3,13,9);assert importlib.metadata.version("fatturapa") == "0.2.0"'
          npm ci --prefix spikes/heavy-local-feasibility --omit=dev
          ffprobe -version | head -1
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -c 'import PIL,pypdf,pptx; print("INDEPENDENT_CONSUMERS_READY")'
      - name: Git change impact + selected source checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run ci:scope -- --base="$BASE_SHA" --run

  cumulative-on-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # A manually dispatched check on another branch cannot attest main.
      # Reject the dispatch rather than skipping the job with a green status.
      - name: Require main revision for manual release admission
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact event SHA for release admission
        if: github.event_name == 'workflow_dispatch'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'
      - run: npm ci
      - name: Preflight pinned independent PDF/A validator
        run: node scripts/preflight-pdfa-validator-419.mjs
      - name: Install pinned independent consumer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv "$RUNNER_TEMP/strumentini-ci-python"
          echo "$RUNNER_TEMP/strumentini-ci-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -m pip install --no-cache-dir 'Pillow==12.2.0' 'pypdf==6.16.1' 'python-pptx==1.0.2'
          sha256sum -c quality/donors/fatturapa/SHA256SUMS
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -m pip install --no-index --no-deps quality/donors/fatturapa/fatturapa-0.2.0-py3-none-any.whl
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -c 'import sys,importlib.metadata;assert sys.version_info[:3] == (3,13,9);assert importlib.metadata.version("fatturapa") == "0.2.0"'
          npm ci --prefix spikes/heavy-local-feasibility --omit=dev
          ffprobe -version | head -1
          "$RUNNER_TEMP/strumentini-ci-python/bin/python" -c 'import PIL,pypdf,pptx; print("INDEPENDENT_CONSUMERS_READY")'
      # Physical PDF/JPEG and OCR consumers are CPU-heavy. Serial workers avoid
      # timeouts caused by unrelated tests competing for the same runner CPU;
      # all existing acceptance assertions and timeouts remain unchanged.
      - run: npm test -- --maxWorkers=1
      - run: npm run test:workerd
      - run: npm run tickets:test
      - run: npm run check
      - run: npm run build
      # A queued manual event can become stale while main advances during
      # the cumulative test/build. Use authoritative remote refs, not local
      # origin/main tracking state; failure/unreachable origin is NO_GO.
      - name: Require current remote main for release admission
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: node node_modules/tsx/dist/cli.mjs scripts/lib/current-remote-main-404.ts --expected-sha="$GITHUB_SHA"
      # Manual source-admission check only; no repo/provider-enforced deploy
      # dependency exists. Missing/stale Gold, rollback, browser/security and
      # physical evidence fail closed. It never writes replacement receipts.
      - name: Read-only cumulative release admission
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: node node_modules/tsx/dist/cli.mjs scripts/validate-release.ts --no-write-receipt --require-ready --expected-sha="$GITHUB_SHA"
