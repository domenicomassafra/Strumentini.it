name: Source checks (no deployment)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Budget: PRs execute changed-source suites plus check/build; main executes the
# cumulative test/check/build path. No browser farm, paid service, cloud deploy,
# receipt generation or release promotion is authorized by this workflow.
# Physical, independent security and release-readiness gates stay NOT_RUN until
# externally evidenced; source CI green does NOT mean release ready.
jobs:
  changed-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required: compare actual base/head, fail if base is absent
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # pdfjs-dist uses Promise.try, available in the supported Node 24 line.
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned independent consumer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv .ci-python
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"
          .ci-python/bin/python -m pip install --no-cache-dir 'Pillow==12.2.0' 'pypdf==6.16.1' 'python-pptx==1.0.2'
          npm ci --prefix spikes/heavy-local-feasibility --omit=dev
          ffprobe -version | head -1
          .ci-python/bin/python -c 'import PIL,pypdf,pptx; print("INDEPENDENT_CONSUMERS_READY")'
      - name: Git change impact + selected source checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run ci:scope -- --base="$BASE_SHA" --run

  cumulative-on-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned independent consumer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv .ci-python
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"
          .ci-python/bin/python -m pip install --no-cache-dir 'Pillow==12.2.0' 'pypdf==6.16.1' 'python-pptx==1.0.2'
          npm ci --prefix spikes/heavy-local-feasibility --omit=dev
          ffprobe -version | head -1
          .ci-python/bin/python -c 'import PIL,pypdf,pptx; print("INDEPENDENT_CONSUMERS_READY")'
      - run: npm test -- --maxWorkers=2
      - run: npm run check
      - run: npm run build
