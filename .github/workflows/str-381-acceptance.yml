name: STR-381 compiled canvas acceptance

on:
  pull_request:
    paths:
      - 'src/engines/image/layer-*381.ts'
      - 'src/components/tools/image-visual/Image*381Tool.tsx'
      - 'src/components/tools/image-visual/ImageCropTool.tsx'
      - 'tests/str-381-*'
      - '.github/workflows/str-381-acceptance.yml'

permissions:
  contents: read

jobs:
  compiled-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/str-381-acceptance.test.ts tests/str-381-refusals.test.ts --maxWorkers=1
      - run: npm run check && npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/str-381-consumer.browser.mjs
