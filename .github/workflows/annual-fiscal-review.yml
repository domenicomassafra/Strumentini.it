name: Annual fiscal source review (#117)

# Owner decision 20/10/2026: agents own the annual official fiscal sources and
# the refresh is automatic. This schedule does not fetch or write tax values; it
# fails closed when the current year has no checked official snapshot. A failed
# GitHub Actions run records the blocked datasets in its log. GitHub's
# native scheduled-workflow failure notification owns follow-up; the job does
# not create new issues. Nothing is released from here.

on:
  schedule:
    # First day of every month, 06:00 UTC (07:00 CET / 08:00 CEST in Rome).
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/reference-data/italy/annual-source-registry-117.ts'
      - 'src/reference-data/italy/fiscal-annual-117.ts'
      - 'src/reference-data/italy/fiscal-annual-vat-117.ts'
      - 'scripts/italy-annual-source-review-117.ts'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Annual official-source review
        run: npx tsx scripts/italy-annual-source-review-117.ts --check
