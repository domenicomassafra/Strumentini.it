name: Portrait MODNet browser acceptance (#274)

on:
  pull_request:
    paths:
      - '.github/workflows/portrait-modnet-274.yml'
      - 'tests/portrait-modnet-274.browser.mjs'
      - 'tests/portrait-modnet-274-browser-readback.mjs'
      - 'tests/portrait-modnet-png-274.test.ts'
      - 'tests/portrait-modnet-274-quantization.mjs'
      - 'tests/fixtures/portrait-modnet-274/**'
      - 'src/components/tools/image-visual/PortraitMattingPanel274.tsx'
      - 'src/engines/image/portrait-modnet*'
      - 'public/models/portrait-modnet/**'
      - 'astro.config.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Browser inference is an opt-in source acceptance lane, never release admission.
# Source CI runs independently and the release gate continues to require mobile
# device evidence, full-frame annotations and owner-level provenance clearance.
jobs:
  quantization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Compare pinned fp32 versus local q8 alpha matte
        run: node tests/portrait-modnet-274-quantization.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Image includes pinned Chromium/Firefox browsers and system libraries.
    # Avoid stalled apt mirrors during Playwright runtime installation.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust checked-out repository in Playwright container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Decode real MODNet RGBA output, independent alpha oracle, CSP and cache
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4327 > "$RUNNER_TEMP/portrait-274-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4327/laboratorio/scontorno-ritratti/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/portrait-274-preview.log"
            exit 1
          fi
          node "tests/portrait-modnet-274.browser.mjs" --full "--$BROWSER-only" --csp --rss
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The Playwright 1.63.0 image contains the WebKit libraries missing from
    # ubuntu-latest. It also avoids apt mirrors that stalled the prior job.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust only the checked-out repository inside container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Decode WebKit MODNet RGBA output with offline warm-cache
        env:
          BROWSER: webkit
        run: |
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4327 > "$RUNNER_TEMP/portrait-274-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4327/laboratorio/scontorno-ritratti/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/portrait-274-preview.log"
            exit 1
          fi
          node "tests/portrait-modnet-274.browser.mjs" --full "--$BROWSER-only" --csp --rss
