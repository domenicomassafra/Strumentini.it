name: HTML entity codec browser acceptance (#301)

on:
  pull_request:
    paths:
      - '.github/workflows/html-entity-301-browser.yml'
      - 'scripts/acceptance-html-entity-301.browser.mjs'
      - 'src/engines/developer-web/html-entities.ts'
      - 'src/components/tools/developer-web/**'
      - 'tests/html-entity-codec-301*.test.ts'
  workflow_dispatch:

permissions:
  contents: read

# Independent browser verification of the compiled local codec, not a deploy.
jobs:
  html-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Independently verify HTML5 conversions, CSP, refusal, zero egress and receipt
        run: node scripts/acceptance-html-entity-301.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-301-browser-receipt
          path: quality/receipts/developer-web/html-entity-codec-301.browser.json
          if-no-files-found: warn
