name: CSV transform undo browser acceptance (#147)

on:
  pull_request:
    paths:
      - '.github/workflows/csv-388-browser.yml'
      - 'tests/str-388-*.browser.mjs'
      - 'quality/fixtures/str-388/**'
      - 'src/components/tools/table/**'
      - 'src/components/tools/csv-cleaner/**'
  workflow_dispatch:

permissions:
  contents: read

# Browser receipt for the compiled consumer; release admission remains separate.
jobs:
  chromium-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify CSV sort, filter, clean, undo, refusals and independent Python oracle
        run: node tests/str-388-consumer.browser.mjs
